<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- No opaque background: the icon renders on the island's dark surface
       (tab strip, settings), where a black tile is invisible. -->
  <g fill="#A78BFA">
    <rect x="14" y="14" width="8" height="8" rx="1"/>
    <rect x="28" y="14" width="8" height="8" rx="1" opacity="0.85"/>
    <rect x="42" y="14" width="8" height="8" rx="1" opacity="0.65"/>
    <rect x="14" y="28" width="8" height="8" rx="1" opacity="0.85"/>
    <rect x="28" y="28" width="8" height="8" rx="1"/>
    <rect x="42" y="28" width="8" height="8" rx="1" opacity="0.85"/>
    <rect x="14" y="42" width="8" height="8" rx="1" opacity="0.65"/>
    <rect x="28" y="42" width="8" height="8" rx="1" opacity="0.85"/>
    <rect x="42" y="42" width="8" height="8" rx="1"/>
  </g>
</svg>
